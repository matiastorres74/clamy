services:
  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - PORT=3001
    volumes:
      - db-data:/app/data
      - uploads-data:/app/uploads
    expose:
      - "3001"

  web:
    build: ./clamy-decohogar
    restart: unless-stopped
    environment:
      - PORT=4000
    expose:
      - "4000"
    depends_on:
      - api

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  db-data:
  uploads-data:
