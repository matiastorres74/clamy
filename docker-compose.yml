services:
  api:
    build: ./server
    restart: unless-stopped
    # DATABASE_URL/DIRECT_URL (Postgres) and BLOB_READ_WRITE_TOKEN must be
    # set in server/.env — there's no local file DB or upload volume anymore.
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
    expose:
      - "3001"

  web:
    build: ./clamy-decohogar
    restart: unless-stopped
    environment:
      - PORT=4000
      # Host header(s) the nginx proxy is allowed to forward, and which
      # forwarded headers to trust for protocol/host detection behind it.
      # Update NG_ALLOWED_HOSTS to the real domain when deploying.
      - NG_ALLOWED_HOSTS=localhost
      - NG_TRUST_PROXY_HEADERS=x-forwarded-proto,x-forwarded-host
    expose:
      - "4000"
    depends_on:
      - api

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
