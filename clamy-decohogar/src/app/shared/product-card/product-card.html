<div class="product-card">
  <a class="product-card-link" [routerLink]="['/productos', product().id]">
    <div class="product-card-image">
      @if (product().imageUrl) {
        <img class="product-image" [src]="product().imageUrl" [alt]="product().name" loading="lazy" />
      } @else {
        <div class="product-image-placeholder">
          <span class="eyebrow">CLAMY</span>
          <span class="placeholder-caption">Foto próximamente</span>
        </div>
      }
    </div>

    <div class="product-card-body">
      <h3 class="product-card-name">{{ product().name }}</h3>
      <span class="product-card-category">{{ categoryLabel(product().category) }}</span>
      <p class="product-card-price">{{ product().price | arsCurrency }}</p>
    </div>
  </a>

  <button class="btn product-card-add" (click)="addToCart()" aria-live="polite">
    {{ added() ? 'Agregado ✓' : 'Agregar' }}
  </button>
</div>
