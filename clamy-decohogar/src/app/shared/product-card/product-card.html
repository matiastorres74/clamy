<a class="product-card" [routerLink]="['/productos', product().id]">
  <figure class="product-card-media">
    @if (product().images[0]; as cover) {
      <!-- sizes mirrors .product-grid: two columns, three above 62.5em inside
           the 75rem container. -->
      <img
        class="product-image"
        [src]="imageSrc(cover, 640)"
        [attr.srcset]="imageSrcset(cover, 1080) || null"
        sizes="(width > 62.5em) 23rem, 50vw"
        [alt]="product().name"
        loading="lazy"
        decoding="async"
      />
    } @else {
      <div class="product-image-placeholder">
        <span class="eyebrow">CLAMY</span>
        <span class="placeholder-caption">Foto próximamente</span>
      </div>
    }
  </figure>

  <div class="product-card-body">
    <span class="product-card-category">{{ categoryLabel(product().category) }}</span>
    <h3 class="product-card-name">{{ product().name }}</h3>
  </div>
</a>
