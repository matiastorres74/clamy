<section class="container login-page">
  <div class="login-card card">
    <span class="eyebrow">Panel privado</span>
    <h1 class="login-title">Acceso administrador</h1>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" [(ngModel)]="username" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <button class="btn btn-solid login-submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
